<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · storage.ae ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--color-surface); }
  .card { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-soft); padding: var(--space-8); width: min(92vw, 380px); }
  .card .logo { margin-bottom: var(--space-6); }
  h1 { font-size: var(--text-xl); margin: 0 0 4px; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 var(--space-6); color: var(--color-muted); font-size: var(--text-sm); }
  .card label.field { margin-bottom: var(--space-4); }
  .card input { width: 100%; }
  .card .btn.primary { width: 100%; justify-content: center; padding: 11px; }
  .msg { color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-4); min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="glyph"></span><span class="word">storage.ae</span></div>
    <h1>Warehouse ops</h1>
    <p class="sub">Enter the team password to continue.</p>
    <label class="field">Password
      <input type="password" id="pw" autocomplete="current-password" autofocus />
    </label>
    <button class="btn primary" id="go">Sign in</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
  const pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  async function submit() {
    msg.textContent = ''; go.disabled = true; go.textContent = 'Signing in';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
      if (r.ok) { location.href = '/'; return; }
      const d = await r.json().catch(() => ({}));
      msg.textContent = d.error || 'Sign in failed';
    } catch { msg.textContent = 'Could not reach the server'; }
    go.disabled = false; go.textContent = 'Sign in';
  }
  go.addEventListener('click', submit);
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
